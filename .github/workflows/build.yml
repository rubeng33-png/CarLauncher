name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'
          cache-provider: basic

      # La clave está cifrada en signing/. El secreto SIGNING_PASSWORD la descifra.
      - name: Preparar firma fija
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Falta el secreto SIGNING_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          KS="$RUNNER_TEMP/carlauncher-firma.p12"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/carlauncher-firma.p12.enc -out "$KS" -pass env:SIGNING_PASSWORD \
            || { echo "::error::La contraseña SIGNING_PASSWORD no es correcta."; exit 1; }
          echo "SIGNING_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Build debug y release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            # Copia los errores como avisos para verlos sin abrir el log completo
            grep -E '^e: |error:|ERROR:|What went wrong|> .*(failed|Could not|Unresolved|not found)' "$RUNNER_TEMP/gradle.log" \
              | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          }

      - name: Verificar firma
        run: |
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          WANT=$(tr -d '[:space:]' < signing/sha256.txt)
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            GOT=$("$SIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
            echo "Firma de $APK: $GOT"
            [ "$GOT" = "$WANT" ] || { echo "::error::$APK no tiene la firma fija esperada."; exit 1; }
          done

      - name: Borrar clave descifrada
        if: always()
        run: rm -f "$RUNNER_TEMP/carlauncher-firma.p12"

      - name: Upload APK release (recomendado, arranca más rápido)
        uses: actions/upload-artifact@v7
        with:
          name: CarLauncher3-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload APK debug
        uses: actions/upload-artifact@v7
        with:
          name: CarLauncher3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Capturas de la pantalla de inicio (para revisar el diseño). Se guardan en la rama "capturas".
  capturas:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'
          cache-provider: basic

      - name: Generar capturas
        run: |
          set -o pipefail
          if [ ! -d app/src/test ]; then echo "Sin pruebas de capturas"; exit 0; fi
          gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            grep -E '^e: |error:|FAILED|Exception|What went wrong' "$RUNNER_TEMP/test.log" \
              | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            exit 1
          }

      - name: Publicar capturas en la rama "capturas"
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          [ -d app/build/capturas ] || { echo "No hay capturas"; exit 0; }
          D="$RUNNER_TEMP/capturas"
          if git ls-remote --exit-code --heads "$URL" capturas >/dev/null; then
            git clone -q --depth 1 -b capturas "$URL" "$D"
          else
            git init -q -b capturas "$D" && git -C "$D" remote add origin "$URL"
          fi
          rm -rf "$D/$GITHUB_REF_NAME"; mkdir -p "$D/$GITHUB_REF_NAME"
          cp app/build/capturas/*.png "$D/$GITHUB_REF_NAME/"
          cd "$D"
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Capturas de $GITHUB_REF_NAME (${GITHUB_SHA::7})" || exit 0
          git push -q origin capturas
