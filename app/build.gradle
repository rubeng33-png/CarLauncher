plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.rgservice.carlauncher13'
    compileSdk 34
    defaultConfig {
        applicationId 'com.rgservice.carlauncher13'
        minSdk 26
        targetSdk 33
        versionCode 6
        versionName '2.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
