plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.rgservice.carlauncher13'
    compileSdk 34
    defaultConfig {
        applicationId 'com.rgservice.carlauncher13'
        minSdk 26
        targetSdk 33
        versionCode 9
        versionName '2.5'
    }
    // Firma fija: GitHub Actions descifra signing/carlauncher-firma.p12.enc y pasa la ruta y la
    // contraseña por variables de entorno. Sin esas variables (Android Studio) se usa la firma debug.
    signingConfigs {
        fija {
            def ks = System.getenv('SIGNING_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'carlauncher'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('SIGNING_KEYSTORE')) signingConfig signingConfigs.fija
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
