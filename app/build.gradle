plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rgservice.carlauncher'
    compileSdk 34

    defaultConfig {
        // Id distinto al launcher anterior: se pueden tener los dos instalados mientras probamos.
        applicationId 'com.rgservice.carlauncher3'
        minSdk 26          // la radio tiene Android 10 (API 29)
        targetSdk 33
        versionCode 3
        versionName '3.0-etapa3'
    }

    // Firma fija: GitHub Actions descifra signing/carlauncher-firma.p12.enc y pasa la ruta y la
    // contraseña por variables de entorno. Sin esas variables (Android Studio) se usa la firma debug.
    def fixedKs = System.getenv('SIGNING_KEYSTORE')
    signingConfigs {
        fija {
            if (fixedKs) {
                storeFile file(fixedKs)
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'carlauncher'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (fixedKs) signingConfig signingConfigs.fija
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Firmada para instalar directo: se instala igual que la debug pero arranca mucho más rápido
            signingConfig fixedKs ? signingConfigs.fija : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures { compose true }
    // Compilador de Compose que corresponde a Kotlin 1.9.22
    composeOptions { kotlinCompilerExtensionVersion '1.5.10' }

    packagingOptions {
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    // Precompila lo que se usa al abrir: arranque más rápido en la radio
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.ui:ui-tooling-preview'
}
